[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slipsurfaceiq-suite"
version = "0.1.0"
description = "Native PySide6 geotechnical engineering suite (10 Python modules; LE excluded)"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Hasan Deniz Altuntaş"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "reportlab>=4.0",
  "PySide6>=6.6,<7",
]

[project.optional-dependencies]
reports = ["python-docx>=1.1", "openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6", "python-docx>=1.1", "openpyxl>=3.1"]

[project.scripts]
slipsurfaceiq-suite = "slipsurface.desktop:main"

[tool.setuptools.packages.find]
include = ["slipsurface*"]

[tool.setuptools.package-data]
"slipsurface.spwa" = ["section_database.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["desktop: GUI tests requiring a Qt offscreen platform"]

[tool.ruff]
line-length = 110
