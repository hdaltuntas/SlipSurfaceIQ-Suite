name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: suite-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile every source
        run: python -m compileall -q main.py slipsurface
      - name: Lint
        run: ruff check main.py slipsurface/apps.py slipsurface/desktop tests
      - name: Run the test suite
        run: python -m pytest -q
