name: Build Windows desktop package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "slipsurface/**"
      - "main.py"
      - "pyproject.toml"
      - "packaging/**"
      - ".github/workflows/windows-package.yml"

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q main.py slipsurface
      - run: python -m pytest -q
      - name: Package standalone executable
        run: pyinstaller --noconfirm --clean packaging/suite.spec
      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SlipSurfaceIQ-Suite.exe")) {
            throw "Windows executable missing"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SlipSurfaceIQ-Suite-Windows-candidate
          path: dist/SlipSurfaceIQ-Suite.exe
          if-no-files-found: error
