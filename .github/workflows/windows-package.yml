name: Build Windows desktop package

on:
  workflow_dispatch:
  push:
    branches: [main, feat/pyside6-native-suite]
    paths:
      - "slipsurface/**"
      - "main.py"
      - "pyproject.toml"
      - "packaging/**"
      - ".github/workflows/windows-package.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q main.py slipsurface
      - run: python -m pytest -q
      - name: Package standalone executable
        run: pyinstaller --noconfirm --clean packaging/suite.spec
      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SlipSurfaceIQ-Suite.exe")) {
            throw "Windows executable missing"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SlipSurfaceIQ-Suite-Windows-candidate
          path: dist/SlipSurfaceIQ-Suite.exe
          if-no-files-found: error

      - name: Publish Windows beta when merged to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-beta.$($env:GITHUB_RUN_NUMBER)"
          gh release create $tag "dist/SlipSurfaceIQ-Suite.exe" `
            --prerelease `
            --target "$env:GITHUB_SHA" `
            --title "SlipSurfaceIQ Suite $tag (Windows beta)" `
            --notes "Pre-release Windows x64 desktop candidate. Native Python/PySide6 with ten geotechnical modules (LE excluded). Numerical validation and end-user acceptance are still required."
