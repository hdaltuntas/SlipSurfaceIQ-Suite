name: Capture native Qt screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/capture_native_ui.py"
      - "slipsurface/desktop/app.py"
      - "slipsurface/desktop/home.py"
      - "slipsurface/desktop/brand.py"
      - "slipsurface/desktop/splash.py"
      - "slipsurface/desktop/theme.py"
      - ".github/workflows/capture-screenshots.yml"

concurrency:
  group: suite-screenshots-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
          python -m pip install -r requirements.txt
      - name: Capture actual running PySide6 window
        run: python scripts/capture_native_ui.py
      - name: Commit screenshots to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/native-pyside6-home-light.png docs/screenshots/native-pyside6-home-dark.png
          git add docs/screenshots/native-pyside6-bearing-light.png docs/screenshots/native-pyside6-bearing-dark.png
          git add docs/screenshots/modules
          git add docs/screenshots/brand-splash.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture home and module PySide6 screenshots [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
