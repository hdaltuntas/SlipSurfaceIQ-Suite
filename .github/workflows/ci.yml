name: Validate Python and Qt suite

on:
  push:
    branches: [main, feat/pyside6-native-suite]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Check Python compilation
        run: python -m compileall -q main.py slipsurface tests
      - name: Lint native shell and tests
        run: ruff check main.py slipsurface/apps.py slipsurface/desktop tests
      - name: Smoke test all migrated module imports and PySide6
        run: pytest -q
